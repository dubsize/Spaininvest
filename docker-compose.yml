# Local stack: docker compose up --build   ->  http://localhost:3000
name: arbscan

x-backend: &backend
  build: ./backend
  image: arbscan-backend:local
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-arbscan}:${POSTGRES_PASSWORD:-arbscan}@db:5432/${POSTGRES_DB:-arbscan}
    REDIS_URL: redis://redis:6379/0
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arbscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arbscan}
      POSTGRES_DB: ${POSTGRES_DB:-arbscan}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arbscan} -d ${POSTGRES_DB:-arbscan}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    command: ["api"]
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  worker:
    <<: *backend
    command: ["worker"]
    depends_on:
      api: { condition: service_healthy }
      redis: { condition: service_healthy }

  beat:
    <<: *backend
    command: ["beat"]
    depends_on:
      api: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
