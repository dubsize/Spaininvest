# Seed catalogue: categories + canonical products.
#
# All products are editable from the UI after seeding. Patterns are regexes evaluated
# against *folded* text (lower-case, accents removed). Keywords prefixed with 're:' are
# regexes too. variant_attributes: attribute -> importance (>=0.8 = a mismatch excludes
# the comparable from valuation).
#
# `demo` blocks are only used by the demo-data generator: they are illustrative
# second-hand price levels for Spain (EUR), NOT authoritative market data.

