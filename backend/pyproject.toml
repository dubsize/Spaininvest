[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "arbscan"
version = "0.2.0"
description = "Multi-marketplace second-hand deal & arbitrage scanner"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "celery>=5.4",
  "redis>=5.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["arbscan*"]

[tool.setuptools.package-data]
arbscan = ["seed/data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "E741", "B027"]
